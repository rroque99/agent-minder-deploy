# ssp-infra-override.yaml
# Chart: ${HELM_REPO}/ssp-infra     Release: infra-${RELEASENAME}     Lab 5
#
# NOTE: the printed guide lost a line break in this sample (a stray "global:"
# ran onto the clickhouse comment line, and fluent-bit's "global:" sat at
# column 0, which is invalid YAML). The structure below is the corrected form.
sspReleaseName: ssp           # must match the ssp release name (RELEASENAME)

clickhouse:
  enabled: true               # ClickHouse - required for AgentMinder observability

global:
  registry:
    existingSecrets:
    - name: ssp-gcr-registry-creds    # fetch images via the pull secret from Lab 2

fluent-bit:
  global:
    registry:
      existingSecrets:
      - name: ssp-gcr-registry-creds  # fetch images via the pull secret from Lab 2
  customConfig:               # build the Fluent Bit ConfigMap for log routing:
    outputs:
    - tags:
      - ssp_log
      - ssp_audit
      - ssp_tp_log
      template: |
        Name es
        Host  elasticsearch-es-http.logging.svc
        Port  9200
        tls   on
        tls.verify   off
        Suppress_Type_Name On
        Replace_Dots On
        Index ${tag}-%Y.%m.%d
        HTTP_User elastic
        HTTP_Passwd <elastic_password>   # from Lab 4 (elasticsearch-es-elastic-user)
