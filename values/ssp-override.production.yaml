# ssp-override.yaml  (production)
# Chart: ${HELM_REPO}/ssp     Release: ${RELEASENAME}     Lab 6
#
# No env-var expansion happens inside this file - edit the literal values below.
# Pair this with db.enabled=false on ssp-infra (see docs/database-connectivity.md).
global:
  imageRepositoryBase: "<registry-base>/"
  useImageDigest: true           # immutable image digests
  observe:
    enabled: true
  otelAcceptExternalRequests:
    enabled: true
ssp:
  deployment:
    size: medium                 # small | medium | large
  db:
    type: mysql                  # mysql | postgresql | oracle
    jdbcUrl: "jdbc:mysql://<db-host>:3306/iamauth"
    sslMode: VERIFY_CA
    existingSecret: ssp-db-credentials     # never inline plaintext in prod
  ingress:
    host: myiam.example.com      # <-- your SSP_FQDN
    type: gatewayapi
    gatewayApi:
      createGateway: false       # attach to an existing enterprise Gateway
      existingGateway: enterprise-gateway
      gatewayClassName: envoy
    tls:
      secretName: ssp-general-tls
    mtls:
      enabled: false             # set true (+ caCertSecretName) for frontend mTLS on Envoy
  featureFlags:
    aigateway: { enabled: true }
    nats:      { enabled: true }
opentelemetry-collector:
  imagePullSecrets:
    - name: ssp-gcr-registry-creds
nats:
  natsBox:
    container:
      image:
        pullSecretNames:
          - ssp-gcr-registry-creds
