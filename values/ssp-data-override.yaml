# ssp-data-override.yaml  (Risk Data Schema + Risk/Network Data)
# Chart: ${HELM_REPO}/ssp-data     Release: data-${RELEASENAME}     Lab 7
#
# ssp-data reuses the ssp chart's DB secret (ssp.db.existingSecret) - it does
# not create its own. Point it at the same secret name the ssp chart uses.
sspReleaseName: ssp           # must match the ssp release name (RELEASENAME)
ssp:
  global:
    ssp:
      registry:
        existingSecrets:
        - name: ssp-gcr-registry-creds  # fetch images via the pull secret from Lab 2
